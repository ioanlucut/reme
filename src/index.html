<!DOCTYPE html>
<html ng-app="reme" ng-controller="AppCtrl" prefix="og: http://ogp.me/ns#">
    <head>
        <meta charset="utf-8" />
        <!-- build:base -->
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Create email reminders in seconds with Reme!" />
        <meta property="og:description" content="The sole purpose of Reme is to remind you the things that matter. Type a reminder in plain English and Reme emails it to you on time." />
        <meta name="description" content="Create email reminders in seconds. The Reme front-end (2014-2016), revived as a backend-less demo." />
        <meta property="og:image" content="https://ioanlucut.github.io/reme/assets/img/logo.png" />
        <meta property="og:url" content="https://ioanlucut.github.io/reme/" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
        <link rel="apple-touch-icon" sizes="57x57" href="/assets/img/favicons/apple-touch-icon-57x57.png">
        <link rel="apple-touch-icon" sizes="114x114" href="/assets/img/favicons/apple-touch-icon-114x114.png">
        <link rel="apple-touch-icon" sizes="72x72" href="/assets/img/favicons/apple-touch-icon-72x72.png">
        <link rel="apple-touch-icon" sizes="144x144" href="/assets/img/favicons/apple-touch-icon-144x144.png">
        <link rel="apple-touch-icon" sizes="60x60" href="/assets/img/favicons/apple-touch-icon-60x60.png">
        <link rel="apple-touch-icon" sizes="120x120" href="/assets/img/favicons/apple-touch-icon-120x120.png">
        <link rel="apple-touch-icon" sizes="76x76" href="/assets/img/favicons/apple-touch-icon-76x76.png">
        <link rel="apple-touch-icon" sizes="152x152" href="/assets/img/favicons/apple-touch-icon-152x152.png">
        <link rel="icon" type="image/png" href="/assets/img/favicons/apple-touch-icon-196x196.png" sizes="196x196">
        <title ng-bind="$state.current.title" class="ng-binding">Create email reminders in seconds - Reme</title>

        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;600;700&amp;display=swap">
        <!-- build:css -->
    </head>

    <body class="body--{{$state.current.pageId}}">

        <!-- Mixpanel initializer -->
        <div mixpanel-initializer></div>

        <!-- View container -->
        <div class="view-container" ui-view autoscroll="true"></div>

        <!-- Loading bar -->
        <div class="loading-bar" loading-bar></div>

        <!-- build:js -->

    </body>
</html>
